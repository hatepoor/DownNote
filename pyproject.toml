[project]
name = "down-note"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.3",
    "dotenv>=0.9.9",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "python-multipart>=0.0.32",
    "pywebview>=6.2.1",
    "sqlalchemy>=2.1.3",
    "typesafe-sdk>=0.7.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/down_note"]
